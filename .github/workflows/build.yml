name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: '8.7', cache-disabled: true }
      - run: gradle assembleRelease --no-daemon
      - id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - run: cp app/build/outputs/apk/release/app-release.apk VpnAuto-${{ steps.ver.outputs.v }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VpnAuto-${{ steps.ver.outputs.v }}
          path: VpnAuto-${{ steps.ver.outputs.v }}.apk
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: VpnAuto ${{ steps.ver.outputs.v }}
          files: VpnAuto-${{ steps.ver.outputs.v }}.apk
          generate_release_notes: true
